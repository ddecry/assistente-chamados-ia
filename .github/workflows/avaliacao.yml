name: Testes e avaliação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_MODEL: llama-3.3-70b-versatile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: pytest -q

      - name: Avaliação text-to-SQL (Groq)
        if: ${{ env.LLM_API_KEY != '' }}
        run: |
          python -m eval.avaliar | tee saida.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat saida.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Aviso sem chave
        if: ${{ env.LLM_API_KEY == '' }}
        run: echo "Cadastre o secret GROQ_API_KEY no repositório para rodar a avaliação." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ env.LLM_API_KEY != '' }}
        with:
          name: resultado-avaliacao
          path: eval/resultado.json
